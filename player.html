    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        .video-player-container {
            max-width: 100%;
            margin: 70px auto;
            padding: 15px;
            background: rgba(10, 10, 10, 0.8);
            border-radius: 8px;
            box-sizing: border-box;
            width: 95%;
        }

        .video-player-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            overflow: hidden;
        }

        .vk-player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .video-title {
            font-size: 24px;
            margin: 20px 0 10px;
            color: #ff8c00;
        }
        
        .video-description {
            color: #ddd;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .video-meta {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 14px;
            border-top: 1px solid #333;
            padding-top: 15px;
            margin-top: 15px;
        }
        
        .player-back-button {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 100;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            opacity: 1; /* Важно: делаем видимой по умолчанию */
        }

        .player-back-button:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.1);
        }

        /* Для мобильных */
        @media (max-width: 768px) {
            .player-back-button {
                width: 35px;
                height: 35px;
                font-size: 18px;
            }
        }

        /* Элементы управления для touch */
        .touch-controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: 10;
            touch-action: none;
        }
        
        .touch-left, .touch-right {
            flex: 1;
            height: 100%;
        }
        
        .touch-center {
            width: 40%;
            height: 100%;
        }
        
        /* Анимация касания */
        .touch-feedback {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            pointer-events: none;
            z-index: 20;
        }
        
        @keyframes touchAnimation {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0.5; }
            50% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        @media (max-width: 768px) {
            .video-player-container {
                margin: 60px auto 20px;
                padding: 10px;
            }
            
            .video-title {
                font-size: 20px;
            }
        }

        @media (orientation: landscape) {
            .video-player-wrapper {
                padding-bottom: 0;
                height: calc(100vh - 20px);
            }
            
            .video-title,
            .video-description,
            .video-meta,
            .back-button {
                display: none;
            }
        }
    </style>

    document.addEventListener('DOMContentLoaded', function() {
        const videoData = videoDatabase[videoId];
        const backButton = document.getElementById('playerBackButton');
        
        // Показываем кнопку всегда
        backButton.style.display = 'flex';
        backButton.style.opacity = '1';

        // Обработчик для кнопки "Назад"
        backButton.addEventListener('click', function() {
            sessionStorage.setItem('videoNavigation', JSON.stringify({
                id: videoId,
                source: 'player'
            }));
            window.location.href = "video.html";
        });

        if (videoData && videoData.vkId) {
            // Устанавливаем информацию о видео
            document.getElementById('videoTitle').textContent = videoData.title;
            document.getElementById('videoDescription').textContent = videoData.description;
            document.getElementById('videoDate').textContent = `Дата: ${videoData.date}`;
            
            // Инициализация VK плеера
            const playerContainer = document.getElementById('vkPlayer');
            playerContainer.innerHTML = `
                <iframe src="${getVKVideoUrl(videoData.vkId)}&autoplay=${autoplay ? 1 : 0}" 
                        width="100%" 
                        height="100%" 
                        frameborder="0" 
                        allowfullscreen 
                        allow="autoplay; encrypted-media; fullscreen; picture-in-picture">
                </iframe>
            `;
            
            // Обновляем количество просмотров после загрузки плеера
            setTimeout(() => {
                const views = Math.floor(Math.random() * 500) + 100;
                document.getElementById('videoViews').textContent = `Просмотров: ${views}`;
            }, 2000);
        } else {
            document.getElementById('vkPlayer').innerHTML = `
                <div style="color: white; text-align: center; padding: 50px;">
                    <h3>Видео не найдено</h3>
                    <p>Запрошенное видео не существует или было удалено.</p>

            `;
        }

        document.querySelector('.nav-link[href="video.html"]').classList.add('active');
    });

    // Обработчик изменения ориентации
    function handleOrientationChange() {
        const wrapper = document.querySelector('.video-player-wrapper');
        if (window.matchMedia("(orientation: landscape)").matches) {
            wrapper.style.paddingBottom = '0';
            wrapper.style.height = 'calc(100vh - 20px)';
        } else {
            wrapper.style.paddingBottom = '56.25%';
            wrapper.style.height = '';
        }
    }

    window.addEventListener('orientationchange', handleOrientationChange);
    window.addEventListener('resize', handleOrientationChange);
